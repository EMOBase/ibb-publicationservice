publicationservice.elasticsearch.index=publicationservice-publications
%test.publicationservice.elasticsearch.index=test-publicationservice-publications
%test.publicationservice.elasticsearch.delete-index-on-start=true

%prod.quarkus.elasticsearch.hosts=es:9200
%dev.quarkus.elasticsearch.hosts=0.0.0.0:9200
%test.quarkus.elasticsearch.hosts=0.0.0.0:9200

quarkus.http.cors=true
quarkus.http.cors.origins=*

quarkus.log.category."org.jboss.resteasy".level=ERROR
%test.quarkus.log.category."org.jboss.resteasy".level=DEBUG
%dev.quarkus.log.category."ibb.api".level=DEBUG

quarkus.container-image.registry=docker.gitlab.gwdg.de
quarkus.container-image.group=ibb/api
quarkus.container-image.name=ibb-publication

quarkus.oidc.auth-server-url=https://ibeetle-base.uni-goettingen.de/ibb/keycloak/realms/ibb
quarkus.oidc.client-id=ibb-client
